  <line x1="400" y1="150" x2="400" y2="210" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
  <line x1="400" y1="210" x2="370" y2="250" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="210" x2="430" y2="250" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  
  <circle cx="400" cy="130" r="10" fill="#06B6A8"/>
  <circle cx="360" cy="170" r="5" fill="#2563EB"/>
  <circle cx="440" cy="170" r="5" fill="#2563EB"/>
  <circle cx="400" cy="210" r="6" fill="#22C55E"/>
