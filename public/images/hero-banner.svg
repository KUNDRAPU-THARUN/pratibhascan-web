      <stop offset="0%" style="stop-color:#0B1736;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0F2454;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#042F2E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6A8;stop-opacity:1" />
