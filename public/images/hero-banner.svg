  <text x="400" y="315" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Pratibha<tspan fill="#06B6A8">Scan</tspan></text>
  <text x="400" y="345" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">DISCOVER POTENTIAL. MEASURE PROGRESS.</text>
